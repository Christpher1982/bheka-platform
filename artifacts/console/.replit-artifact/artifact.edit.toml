kind = "app"
previewPath = "/"
title = "Investigator Console"
version = "1.0.0"
id = "kQ2mXbT9vRc4LpAe7NwYs"

[[services]]
localPort = 5173
name = "Investigator Console"
paths = ["/"]

[services.env]
PORT = "5173"

[services.development]
run = "pnpm --filter @workspace/console run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/console", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"
