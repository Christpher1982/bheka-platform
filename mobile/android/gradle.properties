# Project-wide Gradle settings.

# AndroidX package structure is required for all dependencies used by this
# module (androidx.core, androidx.appcompat, com.google.android.material,
# etc.) — without this, the build fails with:
#   "Configuration `:app:debugRuntimeClasspath` contains AndroidX
#   dependencies, but the `android.useAndroidX` property is not enabled"
android.useAndroidX=true
android.enableJetifier=false

# Enables namespaced R class generation, avoiding unnecessary resource
# regeneration in large projects (harmless default for this module too).
android.nonTransitiveRClass=true

# Kotlin code style used by IDEs opening this project.
kotlin.code.style=official
