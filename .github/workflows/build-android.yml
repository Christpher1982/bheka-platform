name: Build Android Agent (Debug APK)

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-android.yml'
    branches:
      - feature/agent-ingest-rules

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # The gradle-wrapper.jar is intentionally not checked into the repo (see
      # mobile/android/README.md), so this workflow invokes the CI-managed
      # `gradle` binary directly instead of `./gradlew`.
      - name: Build debug APK
        working-directory: mobile/android
        run: |
          set -o pipefail
          # Bake the short git SHA into the version name so any screenshot of the
          # app's About/status screen unambiguously proves which build/commit is
          # actually installed on a device -- this exact confusion (old binary
          # still running after a "fix") already bit us once on the iOS side.
          GIT_SHA=$(git rev-parse --short HEAD)
          echo "Building with versionNameSuffix=-$GIT_SHA"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          gradle assembleDebug -PversionNameSuffix="-$GIT_SHA" 2>&1 | tee /tmp/gradle-build.log
          echo "--- gradle exit: ${PIPESTATUS[0]} ---"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          retention-days: 3

      - name: Verify APK output
        run: |
          APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found at $APK — check gradle-build-log artifact for compiler errors"
            exit 1
          fi
          echo "APK size: $(du -sh "$APK")"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BhekaAgent-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
