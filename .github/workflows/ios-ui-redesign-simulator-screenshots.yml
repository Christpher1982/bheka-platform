name: iOS UI Redesign - Simulator Build & Screenshots (temporary, review-only)

# TEMPORARY workflow added only on feature/ios-ui-redesign to produce Simulator
# build verification + screenshots for PR review, per task requirements. Not
# intended to be merged into main long-term -- see PR description.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/ios-ui-redesign
    paths:
      - '.github/workflows/ios-ui-redesign-simulator-screenshots.yml'

jobs:
  build-and-screenshot:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devicetypes | head -30 && xcrun simctl list runtimes

      - name: Find an available iPhone simulator
        id: find_sim
        run: |
          set -o pipefail
          xcrun simctl list devices available -j > /tmp/sim_devices.json
          cat > /tmp/find_device.py << 'PYEOF_SCRIPT'
          import json
          with open('/tmp/sim_devices.json') as f:
              data = json.load(f)
          candidates = []
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                      candidates.append((runtime, d))
          candidates.sort(key=lambda rd: rd[0])
          if not candidates:
              raise SystemExit('No available iPhone simulator found')
          chosen = candidates[-1][1]
          print(chosen['udid'])
          print(chosen['name'])
          PYEOF_SCRIPT
          python3 /tmp/find_device.py > /tmp/find_device.out
          DEVICE_ID=$(sed -n '1p' /tmp/find_device.out)
          DEVICE_NAME=$(sed -n '2p' /tmp/find_device.out)
          echo "Device ID: $DEVICE_ID ($DEVICE_NAME)"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "device_name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build for iOS Simulator (compile-only verification)
        working-directory: mobile/ios
        env:
          DEVICE_ID: ${{ steps.find_sim.outputs.device_id }}
        run: |
          set -o pipefail
          echo "Using device: $DEVICE_ID"
          xcodebuild build \
            -project BhekaAgent.xcodeproj \
            -scheme BhekaAgent \
            -destination "id=$DEVICE_ID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee /tmp/xcodebuild-sim.log
          echo "--- xcodebuild exit: ${PIPESTATUS[0]} ---"

      - name: Upload generic build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-simulator-log
          path: /tmp/xcodebuild-sim.log
          retention-days: 3

      - name: Build + install + launch on a booted Simulator, then screenshot
        working-directory: mobile/ios
        env:
          DEVICE_ID: ${{ steps.find_sim.outputs.device_id }}
        run: |
          set -o pipefail
          echo "Using device: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

          xcodebuild build \
            -project BhekaAgent.xcodeproj \
            -scheme BhekaAgent \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee /tmp/xcodebuild-install.log

          APP_PATH=$(find /tmp/DerivedData -maxdepth 6 -name "BhekaAgent.app" | head -1)
          echo "App path: $APP_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" io.bheka.agent
          sleep 6

          mkdir -p /tmp/screenshots
          xcrun simctl io "$DEVICE_ID" screenshot /tmp/screenshots/01_status_home.png

          # Attempt to reveal the QR scanner sheet is out of scope for a scripted
          # UI-less tap sequence without XCTest UI automation; capturing the main
          # status/config screen (which contains status card, config card, and the
          # bottom docked action bar / instructional state) covers the primary
          # redesign surfaces requested.
          sleep 2
          xcrun simctl io "$DEVICE_ID" screenshot /tmp/screenshots/02_status_home_after_delay.png

          xcrun simctl shutdown "$DEVICE_ID" || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: /tmp/screenshots
          retention-days: 7

      - name: Upload install/launch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-install-log
          path: /tmp/xcodebuild-install.log
          retention-days: 3
