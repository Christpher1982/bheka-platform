name: Build iOS Agent (Unsigned IPA)

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/build-ios.yml'
    branches:
      - feature/agent-ingest-rules

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.app/Contents/Developer || \
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build archive (unsigned)
        working-directory: mobile/ios
        run: |
          xcodebuild archive \
            -project BhekaAgent.xcodeproj \
            -scheme BhekaAgent \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/BhekaAgent.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="io.bheka.agent" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tail -50
          echo "Archive exit: ${PIPESTATUS[0]}"

      - name: Verify archive
        run: |
          APP="$RUNNER_TEMP/BhekaAgent.xcarchive/Products/Applications/BhekaAgent.app"
          if [ -d "$APP" ]; then
            echo "Archive OK — app bundle found"
            echo "Bundle ID in built plist: $(defaults read "$APP/Info.plist" CFBundleIdentifier 2>/dev/null || echo 'NOT FOUND')"
            echo "App size: $(du -sh "$APP")"
          else
            echo "ERROR: App bundle not found in archive"
            ls -la "$RUNNER_TEMP/BhekaAgent.xcarchive/Products/" 2>/dev/null || echo "Archive dir missing"
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/BhekaAgent.xcarchive/Products/Applications/BhekaAgent.app" \
                "$RUNNER_TEMP/Payload/BhekaAgent.app"
          cd "$RUNNER_TEMP"
          zip -r BhekaAgent-unsigned.ipa Payload
          echo "IPA size: $(du -sh BhekaAgent-unsigned.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BhekaAgent-unsigned-ipa
          path: ${{ runner.temp }}/BhekaAgent-unsigned.ipa
          retention-days: 7
