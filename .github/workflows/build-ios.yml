name: Build iOS Agent (Unsigned IPA)

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/build-ios.yml'
    branches:
      - feature/agent-ingest-rules

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: List project schemes
        working-directory: mobile/ios
        run: xcodebuild -project BhekaAgent.xcodeproj -list

      - name: Build archive (unsigned)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project BhekaAgent.xcodeproj \
            -scheme BhekaAgent \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/BhekaAgent.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="io.bheka.agent" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee /tmp/xcodebuild.log
          echo "--- xcodebuild exit: ${PIPESTATUS[0]} ---"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          retention-days: 3

      - name: Verify archive and package IPA
        run: |
          echo "=== Archive tree ==="
          find "$RUNNER_TEMP/BhekaAgent.xcarchive" -maxdepth 4 2>/dev/null || echo "Archive not found"

          APP="$RUNNER_TEMP/BhekaAgent.xcarchive/Products/Applications/BhekaAgent.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: App bundle not found — check xcodebuild-log artifact for compiler errors"
            exit 1
          fi

          echo "Bundle ID: $(defaults read "$APP/Info.plist" CFBundleIdentifier 2>/dev/null || echo 'NOT FOUND')"
          echo "App size: $(du -sh "$APP")"

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP" "$RUNNER_TEMP/Payload/BhekaAgent.app"
          cd "$RUNNER_TEMP"
          zip -r BhekaAgent-unsigned.ipa Payload
          echo "IPA size: $(du -sh BhekaAgent-unsigned.ipa)"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BhekaAgent-unsigned-ipa
          path: ${{ runner.temp }}/BhekaAgent-unsigned.ipa
          retention-days: 7
